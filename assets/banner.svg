<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Chernox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071413"/>
      <stop offset=".55" stop-color="#071010"/>
      <stop offset="1" stop-color="#060c12"/>
    </linearGradient>
    <linearGradient id="line" x1="80" y1="80" x2="1120" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5bffd0"/>
      <stop offset=".48" stop-color="#18c8a2"/>
      <stop offset="1" stop-color="#4f8dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="20%" r="70%">
      <stop offset="0" stop-color="#18c8a2" stop-opacity=".20"/>
      <stop offset="1" stop-color="#18c8a2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="88%" r="60%">
      <stop offset="0" stop-color="#4f8dff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#4f8dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <rect width="1200" height="420" fill="url(#glow2)"/>

